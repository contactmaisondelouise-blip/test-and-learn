<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Test and Learn : application sombre, cartes en verre, accent or lumineux. Barre latérale à gauche, onglets en haut sur téléphone */
:root{
 --fond:#0B0A09;--surface:#151311;--surface2:#1D1A17;--surface3:#26221E;--filet:rgba(255,240,220,.09);--filet2:rgba(255,240,220,.16);
 --texte:#F5EFE6;--doux:#B3A797;--pale:#7D7266;
 --or:#D4FF3A;--or2:#B6E61F;--orclair:#EEFFB8;--grad:linear-gradient(135deg,#EEFFB8 0%,#D4FF3A 45%,#A8D90F 100%);
 --vert:#4ADE80;--vertf:rgba(74,222,128,.13);--vertc:#BEF264;--vertcf:rgba(190,242,100,.12);--orange:#FDBA74;--orangef:rgba(251,146,60,.14);--rouge:#FB7185;--rougef:rgba(251,113,133,.13);--grisf:rgba(255,240,220,.07);
 --titre:"Inter Tight","Manrope",system-ui,sans-serif;--texte-f:"Manrope",system-ui,sans-serif;
 --creme:var(--fond);--papier:var(--surface);--sable:var(--surface2);--sable2:var(--surface3);--encre:var(--texte);--brun:var(--doux);--gris:var(--pale);
 color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--texte-f);font-size:14.5px;line-height:1.5;
 background-image:radial-gradient(900px 500px at 85% -10%,rgba(212,255,58,.10),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(168,217,15,.07),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--titre);font-weight:700;margin:0;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:34px}h2{font-size:24px}h3{font-size:17px;letter-spacing:-.01em}
p{margin:0}
a{color:var(--or)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
::selection{background:rgba(212,255,58,.35)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:rgba(16,14,12,.85);backdrop-filter:blur(14px);border-right:1px solid var(--filet);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.marque{display:flex;align-items:center;gap:11px;padding:0 6px}
.marque img{width:42px;height:42px;border-radius:12px;box-shadow:0 0 0 1px var(--filet2),0 8px 24px rgba(212,255,58,.18)}
.marque b{font-family:var(--titre);font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.marque b i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.marque span{display:block;font-size:10.5px;color:var(--pale);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:10px 12px;border-radius:11px;color:var(--doux);text-decoration:none;font-weight:600;font-size:14px;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface2);color:var(--texte)}
.nav a[aria-current="page"]{background:var(--surface3);color:var(--texte);box-shadow:inset 0 0 0 1px var(--filet2)}
.nav a[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--or);box-shadow:0 0 10px var(--or);margin-right:-2px}
.nav .nb{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--grad);color:#0B0F02;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.side .pied{margin-top:auto;font-size:11.5px;color:var(--pale);padding:10px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--filet);border-radius:12px;background:var(--surface)}
.side .pied span::before{content:"● ";color:var(--vert)}.side .pied span:empty{display:none}
.main{padding:26px 34px 80px;min-width:0;max-width:1440px}
.tete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.tete p{color:var(--doux);max-width:72ch;margin-top:6px}
.k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--or);font-weight:800}
.carte{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)) ,var(--surface);border:1px solid var(--filet);border-radius:18px;padding:18px;min-width:0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pile{display:flex;flex-direction:column;gap:12px}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--doux)}
.vide{border:1.5px dashed var(--filet2);border-radius:18px;padding:28px;text-align:center;color:var(--doux);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--grad);color:#0B0F02;font-weight:800;font-size:13.5px;cursor:pointer;text-decoration:none;box-shadow:0 6px 22px rgba(212,255,58,.22);transition:transform .12s,box-shadow .12s}

.jauge .cur{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);background:var(--texte);box-shadow:0 0 0 4px rgba(11,10,9,.9),0 0 18px rgba(255,255,255,.55)}
.jauge .rep{position:absolute;top:-17px;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--doux);white-space:nowrap}
.jauge .rep::after{content:"";position:absolute;left:50%;top:15px;width:1px;height:20px;background:var(--filet2)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:18px}
.hero .kpi b{font-size:22px;white-space:nowrap}.hero .grand{padding:24px;border-radius:22px;background:radial-gradient(600px 260px at 100% 0%,rgba(212,255,58,.16),transparent 70%),var(--surface);border:1px solid var(--filet2)}
.chiffre{font-family:var(--titre);font-size:64px;font-weight:800;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums}
.anneau{width:120px;height:120px}
.strats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.strat{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--filet);border-radius:16px;padding:14px;color:var(--texte);display:flex;flex-direction:column;gap:6px;transition:all .15s}
.strat:hover{border-color:rgba(212,255,58,.4);transform:translateY(-2px)}
.strat[aria-pressed="true"]{border-color:var(--or);box-shadow:0 0 0 3px rgba(212,255,58,.18),0 10px 30px rgba(212,255,58,.12);background:linear-gradient(180deg,rgba(212,255,58,.10),transparent),var(--surface)}
.strat b{font-family:var(--titre);font-size:16px;font-weight:800;letter-spacing:-.01em}
.strat .nbr{font-family:var(--titre);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.astuce{display:flex;gap:10px;align-items:flex-start;background:rgba(212,255,58,.08);border:1px solid rgba(212,255,58,.25);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--orclair)}
.astuce::before{content:"✦";color:var(--or);font-size:14px;line-height:1.3}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:g}
.guide div{background:var(--surface2);border:1px solid var(--filet);border-radius:14px;padding:12px;counter-increment:g;font-size:12.5px;color:var(--doux)}
.guide div::before{content:counter(g);display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--grad);color:#0B0F02;font-weight:900;align-items:center;justify-content:center;margin-bottom:6px}
.guide b{display:block;color:var(--texte);font-size:13.5px;margin-bottom:2px}
.choisies{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:14px;background:rgba(212,255,58,.08);border:1px solid rgba(212,255,58,.3)}
.choisies img{width:64px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--or)}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--or)}details[open]>summary::before{content:"▾ "}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{display:none}
 .mobnav{display:flex;position:sticky;top:0;z-index:20;background:rgba(11,10,9,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--filet);overflow-x:auto;gap:4px;padding:8px 10px;scrollbar-width:none}
 .mobnav a{flex:none;color:var(--doux);text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px}
 .mobnav a[aria-current="page"]{background:var(--grad);color:#0B0F02}
 .main{padding:18px 16px 60px}
 h1{font-size:28px}.chiffre{font-size:48px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g2,.courbes,.fiche,.vers,.hero{grid-template-columns:1fr}
 .objbar{grid-template-columns:1fr;gap:20px}

/* Projets : conversations avec Claude et génération */
.pj{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.pjside{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 24px);overflow:auto}
.pjside select,.pn select{flex:1;min-width:0}
.pjliste{display:flex;flex-direction:column;gap:4px}
.pjitem{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;width:100%;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--texte);font-weight:600;font-size:13px}
.pjitem span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pjitem:hover{background:var(--surface2)}.pjitem.on{background:var(--surface3);border-color:var(--filet2)}
.pjads{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pjad{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;padding:8px;border:1px solid var(--filet);border-radius:12px}
.pjad img{width:64px;height:80px;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}.pjad .zoomwrap::after{display:none}
.pjad-vide{width:64px;height:80px;border-radius:8px;background:var(--surface2)}
.pjad .btn{align-self:flex-start;margin-top:4px}
.pjchat{gap:12px}.pjchat.depot,.pn.depot{outline:2px dashed var(--or);outline-offset:4px}
.pjfil{display:flex;flex-direction:column;gap:12px;max-height:62vh;min-height:220px;overflow-y:auto;padding:4px 4px 4px 0}
.bul{max-width:88%;padding:12px 14px;border-radius:16px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.bul.moi{align-self:flex-end;background:var(--surface3);border:1px solid var(--filet2)}
.bul.cl{align-self:flex-start;background:var(--surface2);border:1px solid var(--filet)}
.bul.cl.err{border-color:rgba(251,113,133,.45)}
.bul.gen{align-self:stretch;max-width:100%;background:var(--surface);border:1px solid var(--filet2)}
.pjprompt{padding:10px;border-radius:12px;border:1px solid var(--filet2);display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.pjchips{display:flex;gap:6px;flex-wrap:wrap}.pjchips img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block;cursor:zoom-in}.pjchips.petit img{width:44px;height:44px}.pjchips .zoomwrap::after{display:none}
.pjgens{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pjgen{display:flex;flex-direction:column;gap:6px}.pjgen img{width:100%;border-radius:10px;display:block;cursor:zoom-in}
.pjgen.vide{min-height:180px;border:1.5px dashed var(--filet2);border-radius:10px;align-items:center;justify-content:center;text-align:center;padding:10px}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--filet2);border-top-color:var(--or);animation:tour .9s linear infinite;vertical-align:-3px}
@keyframes tour{to{transform:rotate(360deg)}}
.pjcomp{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--filet);padding-top:12px}
.pjtexte{width:100%;resize:vertical;min-height:70px;border-radius:12px;border:1px solid var(--filet2);background:var(--surface2);padding:10px 12px}
.pjcomp select{min-height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--filet2);padding:0 8px}
.chip{position:relative;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.chip img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}
.chip .doc{display:flex;align-items:center;min-height:64px;padding:0 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--filet2);font-size:12px;max-width:170px}
.chip .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--filet2);background:var(--fond);color:var(--texte);cursor:pointer;font-size:11px;line-height:1}
.chip .garder{font-size:11px;border-radius:999px;border:1px solid var(--filet2);background:var(--surface2);padding:2px 8px;cursor:pointer;color:var(--doux)}.chip .garder.on{background:var(--grad);color:#0B0F02;border-color:transparent}
.pjproduits{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:160px;overflow:auto;padding:6px;border:1px solid var(--filet);border-radius:12px}
.pjprod{padding:0;border:1px solid var(--filet2);border-radius:8px;overflow:hidden;cursor:pointer;background:none}.pjprod img{width:100%;height:64px;object-fit:cover;display:block}.pjprod:hover{border-color:var(--or)}
.puce.petite{min-height:28px;font-size:11.5px;padding:0 10px}
.fab{position:fixed;right:20px;bottom:20px;z-index:40;box-shadow:0 12px 32px rgba(212,255,58,.35)}
.pn{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:45;background:var(--fond);border-left:1px solid var(--filet2);display:flex;flex-direction:column;gap:10px;padding:16px;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.pn .pjfil{flex:1;max-height:none;min-height:0}.pn .bul{max-width:96%}
@media (max-width:860px){.pj{grid-template-columns:1fr}.pjside{position:static;max-height:none}.pjfil{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation:none}}

(function(){
"use strict";
const URL_SB="https://yapuwtsrwagowtuzwdlu.supabase.co",CLE="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhcHV3dHNyd2Fnb3d0dXp3ZGx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjAzNDIsImV4cCI6MjEwNjc5NjM0Mn0.x3v2HhMk4acPKE0M9ZqFOQU8bYBm4-A-pL7ROX22eQA";
const MEDIA=URL_SB+"/storage/v1/object/public/media/";
window.TL_MEDIA=MEDIA;
const sb=window.supabase.createClient(URL_SB,CLE,{auth:{persistSession:true,autoRefreshToken:true}});
window.TL_SB=sb;
let pretResolve;const pret=new Promise(r=>pretResolve=r);
function erreur(code,message){const e=new Error(message||code);e.code=code;return e}
function instantane(lignes){return {docs:lignes.map(l=>({id:l.id,exists:true,data:()=>l.data})),size:lignes.length}}
const abonnes={};
function abonnerCol(col,cb){
 let lignes=new Map();const pousser=()=>cb(instantane([...lignes.values()]));
 sb.from("docs").select("id,data").eq("col",col).limit(2000).then(({data,error})=>{if(error){console.error(error);return}(data||[]).forEach(l=>lignes.set(l.id,l));pousser()});
 const canal=sb.channel("col-"+col+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+col},p=>{
  if(p.eventType==="DELETE"){lignes.delete(p.old.id)}else{lignes.set(p.new.id,{id:p.new.id,data:p.new.data})}pousser()}).subscribe();
 return ()=>sb.removeChannel(canal)}
function decouper(chemin){const i=chemin.lastIndexOf("/");return [chemin.slice(0,i),chemin.slice(i+1)]}
async function lire(col,id){const {data,error}=await sb.from("docs").select("data,version").eq("col",col).eq("id",id).maybeSingle();if(error)throw erreur("upstream_error",error.message);return data}
const db={
 collection(col){const q={limit:()=>q,orderBy:()=>q,where:()=>q,onSnapshot:(cb)=>abonnerCol(col,cb),doc:(id)=>db.doc(col+"/"+id)};return q},
 doc(chemin){const [col,id]=decouper(chemin);return {
  async get(){const d=await lire(col,id);return {exists:!!d,data:()=>d&&d.data}},
  onSnapshot(cb){let actuel=null;const envoyer=()=>cb({exists:!!actuel,data:()=>actuel});
   lire(col,id).then(d=>{actuel=d&&d.data;envoyer()}).catch(()=>{});
   const canal=sb.channel("doc-"+col+"-"+id+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+col},p=>{const r=p.new&&p.new.id?p.new:p.old;if(!r||r.id!==id)return;actuel=p.eventType==="DELETE"?null:p.new.data;envoyer()}).subscribe();
   return ()=>sb.removeChannel(canal)},
  async set(data){const {error}=await sb.from("docs").upsert({col,id,data},{onConflict:"col,id"});if(error)throw erreur(/row-level|permission/i.test(error.message)?"invalid_argument":"upstream_error",error.message)},
  async update(champs){for(let i=0;i<5;i++){const d=await lire(col,id);if(!d){await this.set(champs);return}
    const neuf=Object.assign({},d.data,champs);const {data,error}=await sb.from("docs").update({data:neuf}).eq("col",col).eq("id",id).eq("version",d.version).select("version");
    if(error)throw erreur("upstream_error",error.message);if(data&&data.length)return}throw erreur("conflict","conflit")},
  async delete(){await sb.from("docs").delete().eq("col",col).eq("id",id)}}}};
const assets={async upload(fichier,opts){const type=(opts&&opts.type)||fichier.type||"application/octet-stream";const ext=(fichier.name&&fichier.name.includes(".")?fichier.name.split(".").pop():type.split("/").pop()).toLowerCase().replace(/[^a-z0-9]/g,"");
 if(fichier.size>20*1024*1024)throw erreur("too_large");
 const chemin="depots/"+new Date().toISOString().slice(0,10)+"/"+crypto.randomUUID()+"."+ext;
 const {error}=await sb.storage.from("media").upload(chemin,fichier,{contentType:type,upsert:false});if(error)throw erreur("upstream_error",error.message);
 return {id:chemin,url:MEDIA+chemin,sizeBytes:fichier.size,contentType:type}}};
async function fonction(nom,corps){const {data,error}=await sb.functions.invoke(nom,{body:corps});if(error){let m=error.message;try{const j=await error.context.json();m=j.erreur||m}catch(e){}throw erreur("upstream_error",m)}return data}
window.TL_FONCTION=fonction;
window.TL_CLE={
 async etat(){if(!session)return null;const {data}=await sb.from("cles_claude").select("maj").eq("user_id",session.user.id).maybeSingle();return data},
 async enregistrer(cle){const {error}=await sb.rpc("enregistrer_cle",{p_cle:cle});if(error)throw erreur("upstream_error",error.message);return fonction("claude",{test:true})},
 async supprimer(){await sb.from("cles_claude").delete().eq("user_id",session.user.id)}};
function sample(){}
sample.limits=async()=>({images:true});
sample.json=async(texte,opts)=>{const r=await fonction("claude",{prompt:texte,images:(opts&&opts.chemins)||[]});const t=r.texte||"";const m=t.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m?m[0]:t)};
let session=null;
const user={id:async()=>session&&session.user.id,email:()=>session&&session.user.email};
window.claude={use:async(nom)=>{await pret;return {db,assets,user,sample}[nom]||null}};
window.TL_DECONNEXION=async()=>{await sb.auth.signOut();location.reload()};
function ecranConnexion(msg){document.body.classList.add("hors-ligne");const m=document.getElementById("main");
 m.innerHTML='<div class="connexion"><img src="'+(document.querySelector(".marque img")||{}).src+'" alt=""><h1>test<span class="dore">&amp;</span>learn</h1><p class="note">L\'atelier créa de La Maison de Louise</p>'
 +'<form id="fConnexion" class="pile"><label class="ch">E-mail<input type="text" id="cEmail" autocomplete="username" required></label><label class="ch">Mot de passe<input type="password" id="cMdp" autocomplete="current-password" required></label>'
 +(msg?'<p class="alerte">'+msg+'</p>':'')+'<button class="btn" type="submit">Entrer dans l\'atelier</button></form></div>';
 document.getElementById("fConnexion").addEventListener("submit",async ev=>{ev.preventDefault();const b=ev.target.querySelector("button");b.disabled=true;b.textContent="Connexion…";
  const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("cEmail").value.trim(),password:document.getElementById("cMdp").value});
  if(error){ecranConnexion("E-mail ou mot de passe incorrect.");return}session=data.session;document.body.classList.remove("hors-ligne");m.innerHTML='<div class="vide">Chargement de l\'atelier…</div>';pretResolve()})}
sb.auth.getSession().then(({data})=>{session=data.session;if(session)pretResolve();else ecranConnexion("")});
sb.auth.onAuthStateChange((ev,s)=>{if(s)session=s});
})();

</script>

function kpi(l,v,z){return '<div class="kpi"><b style="color:'+(z?couleurZone(z):"var(--encre)")+'">'+esc(v)+'</b><span>'+esc(l)+'</span></div>'}
function ligneAtelier(t,n,h){return '<a href="'+h+'" class="ligne" style="justify-content:space-between;text-decoration:none;color:inherit"><span>'+esc(t)+'</span><span class="tag'+(n?' z-vertclair':'')+'">'+n+'</span></a>'}

/* ============ PLAN DE LA SEMAINE ============ */
function lundiDe(d){const x=new Date(d);const j=(x.getDay()+6)%7;x.setDate(x.getDate()-j);x.setHours(0,0,0,0);return x}
function cleSemaine(){const l=lundiDe(new Date());return "s"+l.toISOString().slice(0,10)}
function cleJour(){return new Date().toISOString().slice(0,10)}
function objectifs(){const o=S.objectifs||{};return {batchs:Math.max(1,+o.batchsJour||6),hooks:Math.max(1,+o.hooksParBatch||5),jours:Math.max(1,+o.joursSemaine||5)}}
function compteurs(depuis){const ms=S.meres.filter(m=>(m.ts||"")>=depuis),cs=S.creas.filter(c=>(c.ts||"")>=depuis);
 const batchs=new Set(ms.map(m=>String(m.batch||"")).concat(cs.map(c=>String(c.batch||""))).filter(Boolean));
 const neuves=ms.filter(m=>m.mode!=="iteration").length,iter=ms.filter(m=>m.mode==="iteration").length;
 const env=S.creas.filter(c=>(c.envoiTs||"")>=depuis&&["a_envoyer","envoyee"].includes(c.statut)).length;
 return {batchs:batchs.size,neuves,iter,creas:ms.length+cs.length,env}}
const JOURS=[
 {j:"Lundi",role:"Nouveautés en plus",quoi:"Tes 6 batchs du jour, avec 1 ou 2 idées neuves de plus pour lancer la semaine."},
 {j:"Mardi",role:"Lancement",quoi:"Tes 6 batchs du jour. Vérifie que tout ce qui est validé part au Drive avant le lancement du soir."},
 {j:"Mercredi",role:"Itérations",quoi:"Tes 6 batchs du jour, à fond sur les gagnantes : nouvelles accroches, offres, badges sur ce qui marche."},
 {j:"Jeudi",role:"Itérations",quoi:"Tes 6 batchs du jour. Remplace aussi les pubs qui s'essoufflent."},
 {j:"Vendredi",role:"Lecture à 3 jours",quoi:"Tes 6 batchs du jour. Lis aussi les nouveautés de lundi : gagnantes, à itérer, à couper."},
 {j:"Samedi",role:"Pépites",quoi:"Si tu travailles : itère les pépites repérées vendredi."},
 {j:"Dimanche",role:"Bilan",quoi:"On sait ce qui a gagné. Prépare tes sources pour lundi (gagnantes et verbatims)."}];
function memoireIterations(){const m={};S.meres.forEach(x=>{const id=(x.source&&x.source.adId)||(x.mode==="iteration"&&((String((x.refs||[])[0]||"").match(/thumbs\/(\d+)\.jpg/)||[])[1]));if(id&&x.statut!=="rejetee"){if(!m[id]||(x.ts||"")>m[id].ts)m[id]={ts:x.ts||"",batch:x.batch,code:x.code}}});return m}
function sourcesDuJour(){const jr=(new Date().getDay()+6)%7;const o=objectifs();const s7=x=>statAd(x,"7");const mem=memoireIterations();
 const il7=new Date(Date.now()-7*864e5).toISOString();const recente=id=>mem[id]&&mem[id].ts>=il7;
 const rentable=m=>["pousser","iterer"].includes(sigDe(m)); // gagnante affamée = plus de budget, pas une itération
 const etiq=m=>!!parseNom(m.nom);
 const score=m=>(s7(m).roas||0)*Math.log10(10+s7(m).sp);
 const cand=S.metrics.filter(rentable).map(m=>{const ph=phase(m);const r=s7(m).roas||0;
  let lab=sigDe(m)==="pousser"?"Gagnante":"À faire monter";if(ph.niv>=1)lab=r>=SEUIL.gagnante?"Gagnante à rafraîchir":"À rafraîchir";if(etiq(m)&&r>=SEUIL.gagnante)lab="Ton itération qui gagne";
  const prio=(etiq(m)&&r>=SEUIL.gagnante?0:r>=SEUIL.gagnante&&!mem[m.id]?1:r>=SEUIL.gagnante?2:ph.niv>=1?3:4);return {m,lab,prio}});
 const dispo=cand.filter(x=>!recente(x.m.id)).sort((a,b)=>a.prio-b.prio||score(b.m)-score(a.m));
 const enAttente=cand.filter(x=>recente(x.m.id));
 const nbNeuvesBase=jr===0?2:1;const nbIter=Math.min(Math.max(0,o.batchs-nbNeuvesBase),dispo.length);const nbNeuves=o.batchs-nbIter;
 const vbUtil=new Set(S.meres.map(x=>x.verbatimUtilise).filter(Boolean));const vb=((S.verbatims&&S.verbatims.fortes)||[]).filter(v=>!vbUtil.has(v.t));
 const out=[];
 dispo.slice(0,nbIter).forEach((x,k)=>{const d=mem[x.m.id];out.push({id:"it-"+x.m.id,type:"iter",titre:"Itérer "+x.m.nom,etiquette:x.lab,
  detail:"ROAS "+num(s7(x.m).roas,2)+" sur 7 jours · "+eur(s7(x.m).sp)+" · répétition "+num(repetition(x.m)||0,1)+" · "+(d?"dernière itération le "+dateFr(d.ts.slice(0,10))+" (batch "+d.batch+")":"jamais itérée")+" · 1 visuel + "+o.hooks+" hooks",
  action:'<button class="btn petit" data-a="iterer" data-id="'+esc(x.m.id)+'">Itérer</button>',thumb:x.m.thumb})});
 for(let k=0;k<nbNeuves;k++){const v=vb[k];
  out.push({id:"n"+(k+1)+(v?"-"+v.t.slice(0,12):""),type:"neuve",titre:v?"Nouveauté : « "+v.t.slice(0,80)+(v.t.length>80?"…":"")+" »":"Nouveauté à partir d'une pub qui t'inspire",etiquette:k>=nbNeuvesBase?"Nouveauté (plus rien à itérer)":"Nouveauté",
   detail:(v?"Phrase de cliente jamais utilisée · ":"")+"ton inspiration BrandSearch · 1 visuel + "+o.hooks+" hooks",action:v?'<button class="btn sec petit" data-a="verbatimCreer" data-v="'+esc(v.t)+'">Créer avec</button>':'<a class="btn sec petit" href="#creer">Créer</a>'})}
 out.enAttente=enAttente.map(x=>({nom:x.m.nom,thumb:x.m.thumb,d:mem[x.m.id]}));
 return out}

function planSemaine(){const jr=(new Date().getDay()+6)%7;const o=objectifs();const cle=cleJour();const faits=(S.plan&&S.plan.cle===cle&&S.plan.faits)||{};
 const auj=new Date();auj.setHours(0,0,0,0);const cj=compteurs(auj.toISOString());const cs=compteurs(lundiDe(new Date()).toISOString());
 const objJour={batchs:o.batchs,creas:o.batchs*(o.hooks+1)};const objSem={batchs:o.batchs*o.jours,creas:o.batchs*(o.hooks+1)*o.jours};
 const barre=(v,ob,c)=>'<div class="barre" style="height:10px"><i style="width:'+Math.min(100,ob?v/ob*100:0)+'%;background:'+c+'"></i></div>';
 const ligne=(t,v,ob,c)=>'<div class="pile" style="gap:5px"><div class="ligne" style="justify-content:space-between"><b>'+t+'</b><span>'+v+' / '+ob+'</span></div>'+barre(v,ob,c)+'</div>';
 const src=sourcesDuJour();const nbFaits=src.filter(x=>faits[x.id]).length;
 return '<section class="plan"><div class="ligne" style="justify-content:space-between;align-items:flex-end"><div><p class="k">Plan de la semaine · '+esc(JOURS[jr].j)+' : '+esc(JOURS[jr].role)+'</p><h2>Tes '+o.batchs+' batchs du jour</h2><p class="note" style="max-width:72ch">'+esc(JOURS[jr].quoi)+' Un batch = 1 visuel + '+o.hooks+' hooks. L\'appli retient ce que tu as déjà itéré : une pub itérée revient 7 jours plus tard, le temps de lire ses résultats. Quand une de tes itérations gagne, elle passe en premier.</p></div>'
 +'<div class="ligne" style="gap:8px"><span class="note">Batchs par jour</span><input type="number" min="1" max="30" value="'+o.batchs+'" data-obj="batchsJour" style="width:66px;min-height:34px"><span class="note">hooks par batch</span><input type="number" min="1" max="10" value="'+o.hooks+'" data-obj="hooksParBatch" style="width:60px;min-height:34px"></div></div>'
 +'<div class="g2" style="margin:12px 0">'+ligne("Aujourd'hui · batchs lancés",cj.batchs,objJour.batchs,"#D4FF3A")+ligne("Aujourd'hui · créas envoyées au Drive",cj.env,objJour.creas,"#4ADE80")
 +ligne("Semaine · batchs",cs.batchs,objSem.batchs,"#D4FF3A")+ligne("Semaine · créas envoyées",cs.env,objSem.creas,"#4ADE80")+'</div>'
 +'<div class="semaine">'+JOURS.map((d,k)=>'<div class="jour'+(k===jr?' auj':k<jr?' passe':'')+'"><b>'+d.j.slice(0,3)+'</b><span>'+esc(d.role)+'</span></div>').join("")+'</div>'
 +'<div class="ligne" style="justify-content:space-between;margin:14px 0 8px"><p class="k">Tes batchs du jour, sources déjà choisies</p><span class="note">'+nbFaits+' / '+src.length+' faits</span></div>'
 +'<div class="pile" style="gap:8px">'+src.map((x,k)=>'<div class="tache'+(faits[x.id]?' faite':'')+'"><button class="coche" data-a="cocher" data-v="'+esc(x.id)+'" aria-pressed="'+!!faits[x.id]+'" aria-label="Fait">'+(faits[x.id]?"✓":"")+'</button>'
   +(x.thumb?'<img src="'+blob(x.thumb)+'" alt="" style="width:40px;height:50px;object-fit:cover;border-radius:8px;flex:none">':'<span class="num-batch">'+(k+1)+'</span>')
   +'<div style="flex:1;min-width:0"><p style="font-weight:700"><span class="tag '+(x.type==="neuve"?"z-vertclair":"z-vert")+'" style="margin-right:6px">Batch '+(k+1)+' · '+esc(x.etiquette)+'</span>'+esc(x.titre)+'</p><p class="note">'+esc(x.detail)+'</p></div>'+x.action+'</div>').join("")+'</div>'
 +(src.enAttente&&src.enAttente.length?'<details style="margin-top:10px"><summary class="note" style="cursor:pointer">⏳ Déjà itérées ces 7 derniers jours, en attente des résultats ('+src.enAttente.length+') : elles reviendront ensuite</summary><div class="pile" style="gap:6px;margin-top:8px">'+src.enAttente.map(e=>'<div class="ligne" style="flex-wrap:nowrap">'+(e.thumb?'<img src="'+blob(e.thumb)+'" alt="" style="width:30px;height:38px;object-fit:cover;border-radius:6px">':'')+'<span class="note"><b style="color:var(--texte)">'+esc(e.nom)+'</b> · itérée le '+dateFr(e.d.ts.slice(0,10))+' (batch '+esc(e.d.batch||"?")+', '+esc(e.d.code||"")+')</span></div>').join("")+'</div></details>':'')
 +(jr===4?'<div class="tache" style="margin-top:8px"><span class="num-batch">+</span><div style="flex:1"><p style="font-weight:700">Lecture à 3 jours des nouveautés de lundi</p><p class="note">Gagnantes à pousser, à itérer, à couper.</p></div><button class="btn sec petit" data-a="voirStrat" data-v="nouv">Nouveautés</button></div>':'')
 +'</section>'}

 const liste=filtrerMetrics();const per=S.periode;const rows=liste.map(m=>({m,s:statAd(m,per),e:etiqMeta(m)})).filter(x=>x.s.sp>0||per==="lancement");
 const tot=agg(liste.flatMap(m=>lignesPeriode(m,per)));
 const optCamp=[...new Set(S.metrics.map(m=>campagneCourte(m.camp)))].sort();
 const sel=(k,lab,opts)=>'<label class="ch">'+esc(lab)+'<select data-f="'+k+'"><option value="">Tout</option>'+opts.map(o=>'<option'+(S.filtres[k]===o?' selected':'')+'>'+esc(o)+'</option>').join("")+'</select></label>';
 const groupes={};const dim=S.comparer;rows.forEach(x=>{let g;if(dim==="campagne")g=campagneCourte(x.m.camp);else if(dim==="mere")g=x.e&&x.e.mere||"non étiquetée";else if(dim==="variante")g=x.e&&x.e.variante?x.e.variante.replace(/\d+/,"")+" "+x.e.variante:"non étiquetée";else g=x.e?x.e[dim]:"non étiquetée";(groupes[g]=groupes[g]||[]).push(x)});

 return entete("Ce qui marche","Toutes les créas, tous les chiffres. Vert à partir de 2,00, vert clair de 1,89 à 1,99, orange de 1,76 à 1,88, rouge sous 1,76. Objectif de coût par achat : 24,35 € maximum.")
 +'<div class="ligne" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Période">'+[["lancement","Depuis le lancement"],["7","7 jours"],["3","3 jours"],["1","Hier"]].map(([k,t])=>'<button data-a="periode" data-v="'+k+'" aria-pressed="'+(per===k)+'">'+t+'</button>').join("")+'</div><span class="note">Données jusqu\'au '+esc((derniereDate()||"").split("-").reverse().join("/"))+(S.recentes&&S.recentes.length?' · '+S.recentes.length+' pub(s) en attente de diffusion, hors chiffres':'')+'</span></div>'
 +'<div class="kpis" style="margin-bottom:14px">'+kpi("ROAS",num(tot.roas,2),zone(tot.roas,tot.sp))+kpi("Coût par achat",eur(tot.cpa,2),tot.cpa&&tot.cpa<=SEUIL.cpa?"vert":"rouge")+kpi("Achats",num(tot.pu,0),null)+kpi("Dépense",eur(tot.sp),null)+'</div>'
 +blocStrats+(ressort.length?'<div class="carte" style="margin-bottom:14px"><p class="k" style="margin-bottom:8px">Ce qui ressort</p><div class="pile" style="gap:8px">'+ressort.map(r=>'<button class="strat" style="flex-direction:row;align-items:center;justify-content:space-between;padding:10px 14px" data-a="appliquer" data-k="'+esc(r.k)+'" data-v="'+esc(r.g)+'"><span><b style="font-size:14px">'+esc(r.titre)+'</b><span class="note" style="display:block">'+esc(r.detail)+'</span></span><span class="tag z-'+zone(r.roas)+'">'+num(r.roas,2)+'</span></button>').join("")+'</div></div>':'')
 +(lecons.length?'<div class="carte" style="margin-bottom:14px"><p class="k" style="margin-bottom:6px">Les leçons de la période</p><ul style="margin:0;padding-left:18px">'+lecons.map(l=>'<li>'+esc(l)+'</li>').join("")+'</ul></div>':'')
 +'<details class="carte" style="margin-bottom:14px" open><summary style="cursor:pointer;font-weight:800">Filtres</summary><div class="filtres" style="margin-top:10px">'

/* ============ POURQUOI ÇA GAGNE : résultats par étiquette + matrice des angles morts ============ */
const DIM_ETIQ=[["approche","Angle (approche)"],["emotion","Émotion"],["conscience","Conscience"],["tunnel","Tunnel"],["desir","Désir"],["format","Format"],["offre","Offre"],["campagne","Campagne"],["mere","Créa mère"],["variante","Accroche / élément"]];
function reussite(ms){const jug=ms.filter(m=>{const sg=sigDe(m);return sg&&sg!=="attendre"});const ok=jug.filter(m=>["pousser","affamee"].includes(sigDe(m)));return {n:jug.length,ok:ok.length,taux:jug.length?ok.length/jug.length:null}}
function parEtiquettes(rows,per){const dim=DIM_ETIQ.some(d=>d[0]===S.comparer)?S.comparer:"approche";const tous=S.metrics||[];const etq=tous.filter(m=>parseNom(m.nom));
 const groupes={};rows.forEach(x=>{let g;if(dim==="campagne")g=campagneCourte(x.m.camp);else if(dim==="mere")g=x.e&&x.e.mere;else if(dim==="variante")g=x.e&&x.e.variante?x.e.variante.replace(/\d+/,"")+" "+x.e.variante:null;else g=x.e?x.e[dim]:null;if(!g)return;(groupes[g]=groupes[g]||[]).push(x.m)});
 const gl=Object.entries(groupes).map(([g,ms])=>({g,ms,s:agg(ms.flatMap(m=>lignesPeriode(m,per))),r:reussite(ms)})).sort((a,b)=>(b.s.roas||0)-(a.s.roas||0));
 const maxR=Math.max(2.5,...gl.map(x=>x.s.roas||0));const aide=k=>ETIQ[dim]&&ETIQ[dim].aide&&ETIQ[dim].aide[k]?' <span class="note">('+esc(ETIQ[dim].aide[k])+')</span>':'';
 const etiqueteeDim=dim!=="campagne";
 return '<div class="carte" style="margin-bottom:16px"><div class="ligne" style="justify-content:space-between;margin-bottom:6px"><div><h3>Pourquoi ça gagne : résultats par étiquette</h3><p class="note">Pas seulement quelle pub gagne, mais quelle idée : chaque groupe réunit les pubs qui partagent cette étiquette dans leur nom.</p></div><select data-a="comparer" style="width:auto" aria-label="Regrouper par">'+DIM_ETIQ.map(([k,t])=>'<option value="'+k+'"'+(dim===k?" selected":"")+'>'+t+'</option>').join("")+'</select></div>'
  +(etiqueteeDim?'<p class="astuce" style="margin:8px 0"><span><b>'+etq.length+' pub'+(etq.length>1?'s':'')+' sur '+tous.length+'</b> porte'+(etq.length>1?'nt':'')+' aujourd\'hui le nom à 9 étiquettes. Les autres (anciens noms : IMG 5, BATCH 39…) ne peuvent pas être regroupées par idée : elles se lisent par campagne. Ce tableau se remplit à mesure que les créas de l\'appli sont lancées avec leur nom.</span></p>':'')
  +(gl.length?'<div class="tab"><table><tr><th>'+esc((DIM_ETIQ.find(d=>d[0]===dim)||[0,dim])[1])+'</th><th>ROAS</th><th></th><th>Coût par achat</th><th>Dépense</th><th>Achats</th><th>Pubs</th><th data-aide="Part des pubs jugées (au moins 50 € et 4 achats sur 7 jours) qui sont passées en « À pousser » ou « Gagnante affamée ».">Taux de réussite</th></tr>'
  +gl.map(x=>{const z=zone(x.s.roas,x.s.sp);return '<tr><td><b>'+esc(x.g)+'</b>'+aide(x.g)+'</td><td class="n"><span class="tag z-'+z+'">'+num(x.s.roas,2)+'</span></td><td><div class="barre"><i style="width:'+Math.min(100,(x.s.roas||0)/maxR*100)+'%;background:'+couleurZone(z)+'"></i></div></td><td class="n">'+eur(x.s.cpa,2)+'</td><td class="n">'+eur(x.s.sp)+'</td><td class="n">'+num(x.s.pu,0)+'</td><td class="n">'+x.ms.length+'</td><td class="n">'+(x.r.n?Math.round(x.r.taux*100)+' % <span class="note">('+x.r.ok+'/'+x.r.n+')</span>':'<span class="note">pas encore jugées</span>')+'</td></tr>'}).join("")+'</table></div>'
  :'<div class="vide" style="padding:18px">Aucune pub en ligne avec cette étiquette pour l\'instant.</div>')+'</div>'}
function matriceAnglesMorts(per){const axeX=S.matX==="format"?"format":"emotion";const lignes=ETIQ.approche.v,cols=ETIQ[axeX].v;
 const cel={};(S.metrics||[]).forEach(m=>{const e=parseNom(m.nom);if(!e||!e.approche||!e[axeX])return;const k=e.approche+"|"+e[axeX];(cel[k]=cel[k]||[]).push(m)});
 const prep={};(S.creas||[]).concat(S.meres||[]).forEach(c=>{if(!["validee","a_envoyer","envoyee","a_valider"].includes(c.statut))return;const e=parseNom(c.nom);if(!e||!e.approche||!e[axeX])return;const k=e.approche+"|"+e[axeX];prep[k]=(prep[k]||0)+1});
 const nTeste=Object.keys(cel).length,total=lignes.length*cols.length;
 const td=(a,b)=>{const ms=cel[a+"|"+b];const pr=prep[a+"|"+b];if(!ms){return '<td class="mvide" data-aide="'+esc(ETIQ.approche.aide[a]+" × "+ETIQ[axeX].aide[b]+" : jamais testé"+(pr?" ("+pr+" créa(s) en préparation dans l'appli)":"")+".")+'"><span>jamais testé</span>'+(pr?'<em>'+pr+' en prépa</em>':'')+'</td>'}
  const s=agg(ms.flatMap(m=>lignesPeriode(m,per)));const r=reussite(ms);const z=zone(s.roas,s.sp);
  return '<td class="mplein" style="--c:'+couleurZone(z)+'" data-aide="'+esc(ETIQ.approche.aide[a]+" × "+ETIQ[axeX].aide[b]+" : "+ms.length+" pub(s), "+eur(s.sp)+" dépensés, "+num(s.pu,0)+" achats, CPA "+eur(s.cpa,1)+(r.n?", "+r.ok+"/"+r.n+" passées en « pousser »":""))+'"><b>'+num(s.roas,2)+'</b><span>'+eur(s.sp)+' · '+ms.length+' pub'+(ms.length>1?'s':'')+'</span>'+(r.n?'<span>'+Math.round(r.taux*100)+' % réussite</span>':'')+'</td>'};
 return '<div class="carte" style="margin-bottom:16px"><div class="ligne" style="justify-content:space-between;margin-bottom:6px"><div><h3>Matrice des angles morts</h3><p class="note">Chaque case croise un angle et '+(axeX==="format"?"un format":"une émotion")+'. Une case pleine montre ses résultats. Une case vide, c\'est une combinaison <b style="color:var(--texte)">jamais testée</b> : c\'est là que se cherchent les prochaines nouvelles idées.</p></div>'
  +'<div class="seg" role="group" aria-label="Deuxième axe"><button data-a="matX" data-v="emotion" aria-pressed="'+(axeX==="emotion")+'">Angle × émotion</button><button data-a="matX" data-v="format" aria-pressed="'+(axeX==="format")+'">Angle × format</button></div></div>'
  +'<p class="note" style="margin-bottom:8px">'+nTeste+' combinaison'+(nTeste>1?'s':'')+' testée'+(nTeste>1?'s':'')+' sur '+total+'. Survole une case pour le détail.</p>'
  +'<div class="tab"><table class="matrice"><tr><th></th>'+cols.map(c=>'<th data-aide="'+esc(ETIQ[axeX].aide[c]||"")+'">'+esc(c)+'</th>').join("")+'</tr>'+lignes.map(a=>'<tr><th data-aide="'+esc(ETIQ.approche.aide[a]||"")+'">'+esc(a)+' <span class="note">'+esc(ETIQ.approche.aide[a]||"")+'</span></th>'+cols.map(b=>td(a,b)).join("")+'</tr>').join("")+'</table></div></div>'}
function ceQuiRessort(per){const tot=totPer(per);const out=[];
 [["campagne","Campagne"],["tunnel","Tunnel"],["approche","Approche"],["offre","Offre"],["desir","Désir"],["emotion","Émotion"]].forEach(([k,nom])=>{const gr={};
  S.metrics.forEach(m=>{const e=etiqMeta(m);const g=k==="campagne"?campagneCourte(m.camp):(e?e[k]:null);if(!g)return;(gr[g]=gr[g]||[]).push(m)});
  let best=null;Object.entries(gr).forEach(([g,ms])=>{const s=agg(ms.flatMap(m=>lignesPeriode(m,per)));if(ms.length<2||s.sp<100)return;if(!best||s.roas>best.s.roas)best={g,s,n:ms.length}});
  if(best&&tot.roas&&best.s.roas>tot.roas*1.05)out.push({k,g:best.g,roas:best.s.roas,titre:nom+" : "+best.g+(k!=="campagne"&&ETIQ[k]&&ETIQ[k].aide[best.g]?" ("+ETIQ[k].aide[best.g]+")":""),detail:"ROAS "+num(best.s.roas,2)+" sur "+best.n+" créas, contre "+num(tot.roas,2)+" en moyenne. Clique pour les voir."})});
 return out.sort((a,b)=>b.roas-a.roas).slice(0,5)}
function carteCrea(m,s){return '<div class="ccw">'+carteCrea0(m,s)+(m.lien?'<a class="lienpub" href="'+esc(m.lien)+'" target="_blank" rel="noopener" data-aide="Ouvre la publicité telle qu\'elle apparaît sur Facebook et Instagram.">▶ Voir la pub'+(m.type==="video"?" (vidéo)":"")+'</a>':'')+'</div>'}

 return '<button class="cc" data-a="fiche" data-id="'+esc(m.id)+'"><div class="im">'+(m.thumb?'<img src="'+blob(m.thumb)+'" alt="" loading="lazy">':'')+''+(()=>{const sg=sigDe(m);return sg?'<span class="tag z-'+ZONE_SIGNAL[sg]+'">'+esc(NOM_SIGNAL[sg])+'</span>':'<span class="tag z-gris">Pas diffusée cette semaine</span>'})()+'</div><div class="txt"><span class="nom">'+esc(m.nom)+(parseNom(m.nom)?'':' <span class="tag z-orange" style="font-size:10px" data-aide="Pub nommée avant la règle des étiquettes : elle ne peut pas être comparée par idée.">ancien nom</span>')+'</span><span class="note">'+esc(campagneCourte(m.camp))+(m.lance?' · lancée le '+dateFr(m.lance)+(ageJours(m)!=null?' ('+ageJours(m)+' j)':''):'')+(ph.nom?' · <span class="tag '+ph.cls+'" style="font-size:10.5px">'+ph.nom+'</span>':'')+'</span><div class="rs">'+[["Lanc.","lancement"],["7 j","7"],["3 j","3"],["Hier","1"]].map(([l,k])=>{const r=st[k].roas,zz=zone(r,st[k].sp);return '<div><b style="color:'+couleurZone(zz)+'">'+num(r,2)+'</b>'+l+'</div>'}).join("")+'</div><div data-aide="Courbe du ROAS moyen sur 3 jours : vert au-dessus de 1,76 (positif), rouge en dessous (négatif).">'+courbeResultat(m,3,false)+'</div><span class="note">'+eur(s.sp)+' · '+num(s.pu,0)+' achats · CPA '+eur(s.cpa,1)+'</span></div></button>'}

function chipsSignaux(c){return [["vert","à pousser"],["orange","à itérer"],["rouge","à couper"],["gris","sans verdict"]].filter(([k])=>c[k]).map(([k,l])=>'<span class="cchip" style="--c:'+couleurZone(k)+'" data-aide="'+c[k]+' '+l+'"><i></i>'+c[k]+'</span>').join("")}
function vCarte(){const ms=(S.metrics||[]).concat((S.recentes||[]).map(m=>Object.assign(m,{_attente:true})));
 if(!ms.length)return entete("Carte","Tout le compte pub d'un coup d'œil.")+'<div class="vide">Aucune donnée Meta pour l\'instant.</div>';
 const sp=m=>m._attente?0:statAd(m,"7").sp;const camps={};ms.forEach(m=>{const c=m.camp||"Sans campagne",a=m.adset||"Sans ensemble";((camps[c]=camps[c]||{})[a]=camps[c][a]||[]).push(m)});
 const maxAd=Math.max(1,...ms.map(sp));const tot=ms.reduce((t,m)=>t+sp(m),0)||1;
 const ligneAd=m=>{const s=m._attente?null:statAd(m,"7");const sg=m._attente?null:sigDe(m);const z=m._attente?"gris":puceSignal(m);
  return '<button class="cad'+(S.carteSel===m.id?' sel':'')+'" data-a="carteSel" data-id="'+esc(m.id)+'"><i class="pt" style="background:'+couleurZone(z)+'"></i><span class="nom">'+esc(m.nom)+'</span><span class="cbar"><i style="width:'+Math.max(2,sp(m)/maxAd*100)+'%;background:'+couleurZone(z)+'"></i></span><span class="note">'+(m._attente?'en attente de diffusion':(sg?esc(NOM_SIGNAL[sg]):'pas diffusée cette semaine')+' · '+eur(s.sp)+' · ROAS '+num(s.roas,2))+'</span></button>'};
 const cl=Object.entries(camps).map(([c,ens])=>{const tous=Object.values(ens).flat();return {c,ens,tous,s:agg(tous.filter(m=>!m._attente).flatMap(m=>lignesPeriode(m,"7")))}}).sort((a,b)=>b.s.sp-a.s.sp);
 const arbre=cl.map((x,i)=>{const z=zone(x.s.roas,x.s.sp);const k="carte-c-"+i;
  const ensL=Object.entries(x.ens).map(([a,ads])=>({a,ads:ads.slice().sort((p,q)=>sp(q)-sp(p)),s:agg(ads.filter(m=>!m._attente).flatMap(m=>lignesPeriode(m,"7")))})).sort((p,q)=>q.s.sp-p.s.sp);

 const sel=S.carteSel&&ms.find(m=>m.id===S.carteSel);

function pjInstantane(q){const tous=S.metrics||[];const ql=" "+String(q||"").toLowerCase()+" ";
 const cite=tous.filter(m=>{const n=String(m.nom||"").toLowerCase().trim(),a=String(m.adset||"").toLowerCase().trim();return (n.length>=3&&ql.includes(n))||(a.length>=4&&ql.includes(a))||ql.includes(m.id)});

 txt+="Objectif du compte (7 derniers jours, toutes campagnes) : ROAS "+num(t.sp?t.va/t.sp:null,2)+" (cible 2) · CPA "+eur(t.pu?t.sp/t.pu:null,2)+" (cible 24,35 € maximum) · dépense "+eur(t.sp)+" · "+num(t.pu,0)+" achats. Données Meta au "+dateFr(derniereDate())+".\n"

function pjCharger(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function pjImagesVideo(f){const url=URL.createObjectURL(f);const v=document.createElement("video");v.muted=true;v.src=url;v.preload="auto";
 await new Promise((ok,ko)=>{v.onloadedmetadata=ok;v.onerror=ko});const out=[];
 for(const r of [0.08,0.35,0.62,0.9]){v.currentTime=Math.max(0,(v.duration||1)*r);await new Promise(ok=>{v.onseeked=ok});const c=document.createElement("canvas");const w=Math.min(720,v.videoWidth||720);c.width=w;c.height=Math.round(w*(v.videoHeight||1280)/(v.videoWidth||720));c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));out.push(new File([b],f.name.replace(/\.\w+$/,"")+"-"+Math.round(r*100)+".jpg",{type:"image/jpeg"}))}
 URL.revokeObjectURL(url);return out}
async function pjLirePiece(f){const ext=(f.name.split(".").pop()||"").toLowerCase();const nom=f.name;
 if(/^image\//.test(f.type)){const r=await S.assets.upload(f);return {type:"image",p:r.id,nom,label:"Image importée « "+nom+" »"}}
 if(/^video\//.test(f.type)){const ims=await pjImagesVideo(f);const ps=[];for(const i of ims){const r=await S.assets.upload(i);ps.push(r.id)}return {type:"video",nom,images:ps,label:"Vidéo « "+nom+" » (4 images clés)"}}
 if(ext==="pdf"){const r=await S.assets.upload(f,{type:"application/pdf"});return {type:"pdf",p:r.id,nom,label:"PDF « "+nom+" »"}}
 if(["csv","txt","md","json","tsv"].includes(ext)){const t=await f.text();return {type:"texte",nom,texte:t.slice(0,40000),label:"Fichier « "+nom+" »"}}
 if(["xlsx","xls"].includes(ext)){if(!window.XLSX)await pjCharger("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js");const wb=window.XLSX.read(await f.arrayBuffer(),{type:"array"});const t=wb.SheetNames.map(n=>"Feuille "+n+" :\n"+window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n");return {type:"texte",nom,texte:t.slice(0,40000),label:"Tableau « "+nom+" »"}}
 if(ext==="docx"){if(!window.mammoth)await pjCharger("https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js");const r=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return {type:"texte",nom,texte:String(r.value||"").slice(0,40000),label:"Document « "+nom+" »"}}
 throw new Error("Format non pris en charge : "+nom)}

 try{S.db.doc("config/numerotation").onSnapshot(d=>{const x=d.exists?d.data():null;if(x){S.numDernier=+x.dernier||0;rendre()}},()=>{})}catch(e){}
 try{S.db.doc("config/badges").onSnapshot(d=>{const x=d.exists?d.data():null;if(x&&Array.isArray(x.liste)){S.badgesListe=x.liste;rendre()}},()=>{})}catch(e){}
