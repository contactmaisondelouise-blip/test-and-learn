<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Test and Learn : application sombre, cartes en verre, accent or lumineux. Barre latérale à gauche, onglets en haut sur téléphone */
:root{
 --fond:#0B0A09;--surface:#151311;--surface2:#1D1A17;--surface3:#26221E;--filet:rgba(255,240,220,.09);--filet2:rgba(255,240,220,.16);
 --texte:#F5EFE6;--doux:#B3A797;--pale:#7D7266;
 --or:#F2C96B;--or2:#E0A63E;--orclair:#FFE3A1;--grad:linear-gradient(135deg,#FFE3A1 0%,#F2C96B 45%,#E0A63E 100%);
 --vert:#4ADE80;--vertf:rgba(74,222,128,.13);--vertc:#BEF264;--vertcf:rgba(190,242,100,.12);--orange:#FDBA74;--orangef:rgba(251,146,60,.14);--rouge:#FB7185;--rougef:rgba(251,113,133,.13);--grisf:rgba(255,240,220,.07);
 --titre:"Inter Tight","Manrope",system-ui,sans-serif;--texte-f:"Manrope",system-ui,sans-serif;
 --creme:var(--fond);--papier:var(--surface);--sable:var(--surface2);--sable2:var(--surface3);--encre:var(--texte);--brun:var(--doux);--gris:var(--pale);
 color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--texte-f);font-size:14.5px;line-height:1.5;
 background-image:radial-gradient(900px 500px at 85% -10%,rgba(242,201,107,.10),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(224,166,62,.07),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--titre);font-weight:700;margin:0;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:34px}h2{font-size:24px}h3{font-size:17px;letter-spacing:-.01em}
p{margin:0}
a{color:var(--or)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
::selection{background:rgba(242,201,107,.35)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:rgba(16,14,12,.85);backdrop-filter:blur(14px);border-right:1px solid var(--filet);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.marque{display:flex;align-items:center;gap:11px;padding:0 6px}
.marque img{width:42px;height:42px;border-radius:12px;box-shadow:0 0 0 1px var(--filet2),0 8px 24px rgba(242,201,107,.18)}
.marque b{font-family:var(--titre);font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.marque b i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.marque span{display:block;font-size:10.5px;color:var(--pale);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:10px 12px;border-radius:11px;color:var(--doux);text-decoration:none;font-weight:600;font-size:14px;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface2);color:var(--texte)}
.nav a[aria-current="page"]{background:var(--surface3);color:var(--texte);box-shadow:inset 0 0 0 1px var(--filet2)}
.nav a[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--or);box-shadow:0 0 10px var(--or);margin-right:-2px}
.nav .nb{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--grad);color:#1A1308;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.side .pied{margin-top:auto;font-size:11.5px;color:var(--pale);padding:10px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--filet);border-radius:12px;background:var(--surface)}
.side .pied span::before{content:"● ";color:var(--vert)}
.main{padding:26px 34px 80px;min-width:0;max-width:1440px}
.tete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.tete p{color:var(--doux);max-width:72ch;margin-top:6px}
.k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--or);font-weight:800}
.carte{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)) ,var(--surface);border:1px solid var(--filet);border-radius:18px;padding:18px;min-width:0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pile{display:flex;flex-direction:column;gap:12px}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--doux)}
.vide{border:1.5px dashed var(--filet2);border-radius:18px;padding:28px;text-align:center;color:var(--doux);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--grad);color:#1A1308;font-weight:800;font-size:13.5px;cursor:pointer;text-decoration:none;box-shadow:0 6px 22px rgba(242,201,107,.22);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(242,201,107,.32)}
.btn.sec{background:var(--surface2);color:var(--texte);border-color:var(--filet2);box-shadow:none}
.btn.sec:hover{background:var(--surface3)}
.btn.or{background:var(--grad);color:#1A1308}
.btn.rouge{background:transparent;border-color:rgba(251,113,133,.45);color:var(--rouge);box-shadow:none}
.btn.petit{min-height:34px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
label.ch{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--doux);letter-spacing:.02em}
input[type=text],input[type=number],select,textarea{width:100%;min-height:42px;border:1px solid var(--filet2);border-radius:12px;background:var(--surface2);padding:9px 12px;font-size:14px;font-weight:500;color:var(--texte)}
input::placeholder,textarea::placeholder{color:var(--pale)}
select option{background:var(--surface2)}
textarea{min-height:74px;resize:vertical}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--filet2);background:var(--surface2);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--doux);transition:all .12s}
.puce:hover{color:var(--texte);border-color:rgba(242,201,107,.4)}
.puce[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#1A1308;box-shadow:0 4px 16px rgba(242,201,107,.25)}
.puce[aria-pressed="true"] span{opacity:.8!important}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--grisf);color:var(--doux);white-space:nowrap}
.z-vert{background:var(--vertf);color:var(--vert)}.z-vertclair{background:var(--vertcf);color:var(--vertc)}.z-orange{background:var(--orangef);color:var(--orange)}.z-rouge{background:var(--rougef);color:var(--rouge)}.z-gris{background:var(--grisf);color:var(--pale)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--filet);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-family:var(--titre);font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi span{font-size:12px;color:var(--doux)}
.seg{display:inline-flex;border:1px solid var(--filet2);border-radius:12px;overflow:hidden;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--doux);border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--texte);box-shadow:inset 0 0 0 1px var(--filet2)}
.filtres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tab{overflow-x:auto;border:1px solid var(--filet);border-radius:14px;background:var(--surface)}
table{color:inherit;border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--pale);padding:10px 12px;border-bottom:1px solid var(--filet);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--filet)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap}
.barre{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden;min-width:60px}
.barre i{display:block;height:100%;border-radius:4px}
.creas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cc{background:var(--surface);border:1px solid var(--filet);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:var(--texte);transition:transform .15s,border-color .15s,box-shadow .15s}
.cc:hover{transform:translateY(-3px);border-color:rgba(242,201,107,.45);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.cc .im{aspect-ratio:4/5;background:var(--surface2);position:relative}
.cc .im img{width:100%;height:100%;object-fit:cover;display:block}
.cc .im .tag{position:absolute;left:9px;top:9px;backdrop-filter:blur(8px);background:rgba(11,10,9,.65)}
.cc .im .tag.z-vert{color:var(--vert)}.cc .im .tag.z-vertclair{color:var(--vertc)}.cc .im .tag.z-orange{color:var(--orange)}.cc .im .tag.z-rouge{color:var(--rouge)}
.cc .txt{padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cc .nom{font-weight:800;font-size:12.5px;word-break:break-all;line-height:1.3}
.cc .rs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:10.5px;text-align:center;color:var(--pale)}
.cc .rs div{background:var(--surface2);border-radius:8px;padding:5px 2px}
.cc .rs b{display:block;font-size:13px}
.signal{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--filet);border-radius:14px;padding:12px 14px 12px 0;overflow:hidden}
.signal>i{align-self:stretch;border-radius:0 4px 4px 0;box-shadow:0 0 14px currentColor}
.signal p.t{font-weight:700}
.modal{position:fixed;inset:0;background:rgba(5,4,3,.72);backdrop-filter:blur(6px);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:30px 16px;overflow-y:auto}
.modal .boite{background:var(--fond);border:1px solid var(--filet2);border-radius:22px;max-width:1120px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.fiche{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}
.fiche img.v{width:100%;border-radius:14px;border:1px solid var(--filet)}
.courbe{background:var(--surface);border:1px solid var(--filet);border-radius:14px;padding:12px 14px}
.courbe svg{width:100%;height:auto;display:block}
.courbes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grad);color:#1A1308;padding:11px 18px;border-radius:12px;font-weight:800;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.vers{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--filet);border-radius:18px;padding:14px}
.vers canvas{width:100%;border-radius:12px;border:1px solid var(--filet);background:var(--surface2);touch-action:none;cursor:grab}
.chg{font-size:12px;color:var(--or);font-weight:700}
.alerte{background:var(--orangef);border:1px solid rgba(251,146,60,.35);color:var(--orange);border-radius:12px;padding:10px 12px;font-size:13px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.refs button{position:relative;padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--surface2);cursor:pointer;aspect-ratio:4/5;color:var(--doux);transition:transform .12s}
.refs button:hover{transform:scale(1.03)}
.refs button[aria-pressed="true"]{border:3px solid var(--or);box-shadow:0 0 0 4px rgba(242,201,107,.25),0 0 26px rgba(242,201,107,.35)}
.refs button[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--grad);color:#1A1308;font-weight:900;display:flex;align-items:center;justify-content:center}
.refs button[aria-pressed="true"] img{opacity:1}
.refs.choix-actif button[aria-pressed="false"] img{opacity:.45}
.refs img{width:100%;height:100%;object-fit:cover;display:block}
.statut{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--grisf);color:var(--doux)}
.st-a_generer,.st-en_cours{background:rgba(96,165,250,.14);color:#93C5FD}.st-a_valider{background:var(--orangef);color:var(--orange)}.st-validee,.st-envoyee{background:var(--vertf);color:var(--vert)}.st-rejetee,.st-erreur{background:var(--rougef);color:var(--rouge)}.st-a_envoyer{background:rgba(192,132,252,.14);color:#D8B4FE}
.mobnav{display:none}
body.hors-ligne .side,body.hors-ligne .mobnav{display:none}body.hors-ligne .app{grid-template-columns:1fr}
.connexion{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:center}
.connexion img{width:84px;height:84px;border-radius:22px;margin:0 auto;box-shadow:0 0 0 1px var(--filet2),0 18px 50px rgba(242,201,107,.25)}
.connexion form{text-align:left;margin-top:10px;background:var(--surface);border:1px solid var(--filet);border-radius:20px;padding:20px}
.connexion .dore{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
input[type=password]{width:100%;min-height:42px;border:1px solid var(--filet2);border-radius:12px;background:var(--surface2);padding:9px 12px;font-size:14px;color:var(--texte)}
.bulle{position:fixed;z-index:80;max-width:300px;padding:9px 12px;border-radius:11px;background:#2A2520;border:1px solid rgba(242,201,107,.35);color:var(--texte);font-size:12.5px;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.55);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.bulle.on{opacity:1;transform:none}
.bulle b{color:var(--or)}
/* Objectif */
.objbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--filet);border-radius:16px;padding:12px 18px;margin-bottom:20px}
.objbar .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pale);font-weight:800}
.objbar .val{font-family:var(--titre);font-weight:800;font-size:20px;letter-spacing:-.02em}
.jauge{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,rgba(251,113,133,.35) 0%,rgba(251,113,133,.35) var(--p176),rgba(253,186,116,.35) var(--p176),rgba(253,186,116,.35) var(--p189),rgba(190,242,100,.3) var(--p189),rgba(190,242,100,.3) var(--p200),rgba(74,222,128,.38) var(--p200));}
.jauge .cur{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);background:var(--texte);box-shadow:0 0 0 4px rgba(11,10,9,.9),0 0 18px rgba(255,255,255,.55)}
.jauge .rep{position:absolute;top:-17px;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--doux);white-space:nowrap}
.jauge .rep::after{content:"";position:absolute;left:50%;top:15px;width:1px;height:20px;background:var(--filet2)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:18px}
.hero .kpi b{font-size:22px;white-space:nowrap}.hero .grand{padding:24px;border-radius:22px;background:radial-gradient(600px 260px at 100% 0%,rgba(242,201,107,.16),transparent 70%),var(--surface);border:1px solid var(--filet2)}
.chiffre{font-family:var(--titre);font-size:64px;font-weight:800;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums}
.anneau{width:120px;height:120px}
.strats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.strat{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--filet);border-radius:16px;padding:14px;color:var(--texte);display:flex;flex-direction:column;gap:6px;transition:all .15s}
.strat:hover{border-color:rgba(242,201,107,.4);transform:translateY(-2px)}
.strat[aria-pressed="true"]{border-color:var(--or);box-shadow:0 0 0 3px rgba(242,201,107,.18),0 10px 30px rgba(242,201,107,.12);background:linear-gradient(180deg,rgba(242,201,107,.10),transparent),var(--surface)}
.strat b{font-family:var(--titre);font-size:16px;font-weight:800;letter-spacing:-.01em}
.strat .nbr{font-family:var(--titre);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.astuce{display:flex;gap:10px;align-items:flex-start;background:rgba(242,201,107,.08);border:1px solid rgba(242,201,107,.25);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--orclair)}
.astuce::before{content:"✦";color:var(--or);font-size:14px;line-height:1.3}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:g}
.guide div{background:var(--surface2);border:1px solid var(--filet);border-radius:14px;padding:12px;counter-increment:g;font-size:12.5px;color:var(--doux)}
.guide div::before{content:counter(g);display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--grad);color:#1A1308;font-weight:900;align-items:center;justify-content:center;margin-bottom:6px}
.guide b{display:block;color:var(--texte);font-size:13.5px;margin-bottom:2px}
.choisies{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:14px;background:rgba(242,201,107,.08);border:1px solid rgba(242,201,107,.3)}
.choisies img{width:64px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--or)}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--or)}details[open]>summary::before{content:"▾ "}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{display:none}
 .mobnav{display:flex;position:sticky;top:0;z-index:20;background:rgba(11,10,9,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--filet);overflow-x:auto;gap:4px;padding:8px 10px;scrollbar-width:none}
 .mobnav a{flex:none;color:var(--doux);text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px}
 .mobnav a[aria-current="page"]{background:var(--grad);color:#1A1308}
 .main{padding:18px 16px 60px}
 h1{font-size:28px}.chiffre{font-size:48px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g2,.courbes,.fiche,.vers,.hero{grid-template-columns:1fr}
 .objbar{grid-template-columns:1fr;gap:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

(function(){
"use strict";
const URL_SB="https://yapuwtsrwagowtuzwdlu.supabase.co",CLE="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhcHV3dHNyd2Fnb3d0dXp3ZGx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjAzNDIsImV4cCI6MjEwNjc5NjM0Mn0.x3v2HhMk4acPKE0M9ZqFOQU8bYBm4-A-pL7ROX22eQA";
const MEDIA=URL_SB+"/storage/v1/object/public/media/";
window.TL_MEDIA=MEDIA;
const sb=window.supabase.createClient(URL_SB,CLE,{auth:{persistSession:true,autoRefreshToken:true}});
window.TL_SB=sb;
let pretResolve;const pret=new Promise(r=>pretResolve=r);
function erreur(code,message){const e=new Error(message||code);e.code=code;return e}
function instantane(lignes){return {docs:lignes.map(l=>({id:l.id,exists:true,data:()=>l.data})),size:lignes.length}}
const abonnes={};
function abonnerCol(col,cb){
 let lignes=new Map();const pousser=()=>cb(instantane([...lignes.values()]));
 sb.from("docs").select("id,data").eq("col",col).limit(2000).then(({data,error})=>{if(error){console.error(error);return}(data||[]).forEach(l=>lignes.set(l.id,l));pousser()});
 const canal=sb.channel("col-"+col+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+col},p=>{
  if(p.eventType==="DELETE"){lignes.delete(p.old.id)}else{lignes.set(p.new.id,{id:p.new.id,data:p.new.data})}pousser()}).subscribe();
 return ()=>sb.removeChannel(canal)}
function decouper(chemin){const i=chemin.lastIndexOf("/");return [chemin.slice(0,i),chemin.slice(i+1)]}
async function lire(col,id){const {data,error}=await sb.from("docs").select("data,version").eq("col",col).eq("id",id).maybeSingle();if(error)throw erreur("upstream_error",error.message);return data}
const db={
 collection(col){const q={limit:()=>q,orderBy:()=>q,where:()=>q,onSnapshot:(cb)=>abonnerCol(col,cb),doc:(id)=>db.doc(col+"/"+id)};return q},
 doc(chemin){const [col,id]=decouper(chemin);return {
  async get(){const d=await lire(col,id);return {exists:!!d,data:()=>d&&d.data}},
  onSnapshot(cb){let actuel=null;const envoyer=()=>cb({exists:!!actuel,data:()=>actuel});
   lire(col,id).then(d=>{actuel=d&&d.data;envoyer()}).catch(()=>{});
   const canal=sb.channel("doc-"+col+"-"+id+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+col},p=>{const r=p.new&&p.new.id?p.new:p.old;if(!r||r.id!==id)return;actuel=p.eventType==="DELETE"?null:p.new.data;envoyer()}).subscribe();
   return ()=>sb.removeChannel(canal)},
  async set(data){const {error}=await sb.from("docs").upsert({col,id,data},{onConflict:"col,id"});if(error)throw erreur(/row-level|permission/i.test(error.message)?"invalid_argument":"upstream_error",error.message)},
  async update(champs){for(let i=0;i<5;i++){const d=await lire(col,id);if(!d){await this.set(champs);return}
    const neuf=Object.assign({},d.data,champs);const {data,error}=await sb.from("docs").update({data:neuf}).eq("col",col).eq("id",id).eq("version",d.version).select("version");
    if(error)throw erreur("upstream_error",error.message);if(data&&data.length)return}throw erreur("conflict","conflit")},
  async delete(){await sb.from("docs").delete().eq("col",col).eq("id",id)}}}};
const assets={async upload(fichier,opts){const type=(opts&&opts.type)||fichier.type||"application/octet-stream";const ext=(fichier.name&&fichier.name.includes(".")?fichier.name.split(".").pop():type.split("/").pop()).toLowerCase().replace(/[^a-z0-9]/g,"");
 if(fichier.size>20*1024*1024)throw erreur("too_large");
 const chemin="depots/"+new Date().toISOString().slice(0,10)+"/"+crypto.randomUUID()+"."+ext;
 const {error}=await sb.storage.from("media").upload(chemin,fichier,{contentType:type,upsert:false});if(error)throw erreur("upstream_error",error.message);
 return {id:chemin,url:MEDIA+chemin,sizeBytes:fichier.size,contentType:type}}};
async function fonction(nom,corps){const {data,error}=await sb.functions.invoke(nom,{body:corps});if(error){let m=error.message;try{const j=await error.context.json();m=j.erreur||m}catch(e){}throw erreur("upstream_error",m)}return data}
window.TL_FONCTION=fonction;
function sample(){}
sample.limits=async()=>({images:true});
sample.json=async(texte,opts)=>{const r=await fonction("claude",{prompt:texte,images:(opts&&opts.chemins)||[]});const t=r.texte||"";const m=t.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m?m[0]:t)};
let session=null;
const user={id:async()=>session&&session.user.id,email:()=>session&&session.user.email};
window.claude={use:async(nom)=>{await pret;return {db,assets,user,sample}[nom]||null}};
window.TL_DECONNEXION=async()=>{await sb.auth.signOut();location.reload()};
function ecranConnexion(msg){document.body.classList.add("hors-ligne");const m=document.getElementById("main");
 m.innerHTML='<div class="connexion"><img src="'+(document.querySelector(".marque img")||{}).src+'" alt=""><h1>Test <span class="dore">and</span> Learn</h1><p class="note">L\'atelier créa de La Maison de Louise</p>'
 +'<form id="fConnexion" class="pile"><label class="ch">E-mail<input type="text" id="cEmail" autocomplete="username" required></label><label class="ch">Mot de passe<input type="password" id="cMdp" autocomplete="current-password" required></label>'
 +(msg?'<p class="alerte">'+msg+'</p>':'')+'<button class="btn" type="submit">Entrer dans l\'atelier</button></form></div>';
 document.getElementById("fConnexion").addEventListener("submit",async ev=>{ev.preventDefault();const b=ev.target.querySelector("button");b.disabled=true;b.textContent="Connexion…";
  const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("cEmail").value.trim(),password:document.getElementById("cMdp").value});
  if(error){ecranConnexion("E-mail ou mot de passe incorrect.");return}session=data.session;document.body.classList.remove("hors-ligne");m.innerHTML='<div class="vide">Chargement de l\'atelier…</div>';pretResolve()})}
sb.auth.getSession().then(({data})=>{session=data.session;if(session)pretResolve();else ecranConnexion("")});
sb.auth.onAuthStateChange((ev,s)=>{if(s)session=s});
})();

</script>

function changements(m,v){const c=[];if(v.headline!==m.headline)c.push("headline");if((v.sous||"")!==(m.sous||""))c.push("sous-titre");if((v.offre||"")!==(m.offre||""))c.push("offre");if((v.bouton||"")!==(m.bouton||""))c.push("bouton");
 const b0=m.badges||[],b1=v.badges||[];b1.filter(x=>!b0.includes(x)).forEach(x=>c.push("+ "+x));b0.filter(x=>!b1.includes(x)).forEach(x=>c.push("− "+x));
 if((v.produit!==false)!==(m.produit!==false))c.push(v.produit===false?"sans produit":"avec produit");if(v.tunnel!==m.tunnel)c.push("étage "+v.tunnel);if(v.titre!==m.titre)c.push("titre "+v.titre);if(JSON.stringify(v.pos||{})!==JSON.stringify(m.pos||{}))c.push("placement");return c}
function nouvelleVersion(m,type){const deja=S.creas.filter(c=>c.mere===m.code).map(c=>c.code).concat(S.decl.versions.map(v=>v.code));let i=type==="H"?2:1;while(deja.includes(m.code+type+i))i++;
 return {type,code:m.code+type+i,headline:m.headline,sous:m.sous||"",offre:m.offre||"",bouton:m.bouton||"",badges:(m.badges||[]).slice(),produit:m.produit!==false,tunnel:m.tunnel,titre:m.titre||"M",note:"",pos:Object.assign({},m.pos||{})}}

 const t=ev.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
 if(a==="fermer"){if(t.classList.contains("modal")&&ev.target.closest("[data-stop]"))return;$("#modal").innerHTML="";return}

 if(a==="puce"){const k=t.dataset.k,v=t.dataset.v,multi=t.dataset.multi==="1";

 if(a==="produit"){S.form.produit=t.dataset.v==="1";saveForm();rendre();return}
 if(a==="ref"){const v=t.dataset.v;S.form.refs=S.form.refs.includes(v)?S.form.refs.filter(x=>x!==v):S.form.refs.concat(v);saveForm();rendre();return}
 if(a==="viderRefs"){S.form.refs=[];saveForm();rendre();return}

 if(a==="mereRetouche"){demanderNote("Retouche de la mère","Que faut-il changer ?",async n=>{await ecrire("meres/"+t.dataset.id,{statut:"a_generer",retouche:n,maj:maintenant()},true);lancer("meres",t.dataset.id);toast("Retouche envoyée au moteur")});return}

 if(a==="iterer"){await itererGagnante(t.dataset.id);return}
 if(a==="proposer"){await proposerFiche();return}
 if(a==="proposerHooks"){await proposerHooks();return}

async function envoyerImages(files){if(!S.assets){toast("Dépôt indisponible : accès Éditeur requis.");return}let n=0;for(const f of files){try{const r=await S.assets.upload(f);await ecrire("refs/r"+r.id,{asset:r.id,note:"",tags:[],ts:maintenant(),par:S.uid});if(S.tab==="creer"){S.form.refs=S.form.refs.concat("a:"+r.id);saveForm()}n++}catch(e){toast(e&&e.code==="too_large"?"Image trop lourde (20 Mo max).":"Dépôt refusé : "+(e&&e.code||"erreur"))}}if(n)toast(n+" référence(s) ajoutée(s)")}

async function demarrer(){const h=location.hash.slice(1);if(ONGLETS.some(o=>o[0]===h))S.tab=h;
 const [db,assets,user,sample]=await Promise.all(["db","assets","user","sample"].map(n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null)));
 S.db=db;S.assets=assets;S.user=user;S.sample=sample;S.pret=true;
 if(user){try{S.uid=await user.id()}catch(e){}}

 ["meres","creas","batches","refs","depots"].forEach(c=>abonner(c,c));
 try{S.db.collection("metrics").limit(100).onSnapshot(sn=>{const out=[];sn.docs.forEach(d=>{const x=d.data();(x.ads||[]).forEach(a=>out.push(Object.assign({},a)))});let fin="";out.forEach(m=>(m.d||[]).forEach(r=>{if(r[0]>fin)fin=r[0]}));
  viderCache();S.recentes=out.filter(m=>m.lance&&m.lance>=fin);S.metrics=out.filter(m=>!(m.lance&&m.lance>=fin));rendre()},()=>{})}catch(e){}
 try{S.db.doc("etat/resume").onSnapshot(d=>{S.resume=d.exists?d.data():null;const mt=$("#moteur");if(mt&&S.resume&&S.resume.maj)mt.textContent="Données Meta : "+new Date(S.resume.maj).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});rendre()},()=>{})}catch(e){}
 try{const q=$("#qui");if(q&&S.user&&S.user.email)q.textContent="Connecté : "+S.user.email()}catch(e){}
 rendre()}
demarrer();
})();
