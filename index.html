<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter+Tight:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Test and Learn : application sombre, cartes en verre, accent or lumineux. Barre latérale à gauche, onglets en haut sur téléphone */
:root{
 --fond:#0B0A09;--surface:#151311;--surface2:#1D1A17;--surface3:#26221E;--filet:rgba(255,240,220,.09);--filet2:rgba(255,240,220,.16);
 --texte:#F5EFE6;--doux:#B3A797;--pale:#7D7266;
 --or:#D4FF3A;--or2:#B6E61F;--orclair:#EEFFB8;--grad:linear-gradient(135deg,#EEFFB8 0%,#D4FF3A 45%,#A8D90F 100%);
 --vert:#4ADE80;--vertf:rgba(74,222,128,.13);--vertc:#BEF264;--vertcf:rgba(190,242,100,.12);--orange:#FDBA74;--orangef:rgba(251,146,60,.14);--rouge:#FB7185;--rougef:rgba(251,113,133,.13);--grisf:rgba(255,240,220,.07);
 --titre:"Inter Tight","Manrope",system-ui,sans-serif;--texte-f:"Manrope",system-ui,sans-serif;
 --creme:var(--fond);--papier:var(--surface);--sable:var(--surface2);--sable2:var(--surface3);--encre:var(--texte);--brun:var(--doux);--gris:var(--pale);
 color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--texte-f);font-size:14.5px;line-height:1.5;
 background-image:radial-gradient(900px 500px at 85% -10%,rgba(212,255,58,.10),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(168,217,15,.07),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--titre);font-weight:700;margin:0;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:34px}h2{font-size:24px}h3{font-size:17px;letter-spacing:-.01em}
p{margin:0}
a{color:var(--or)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
::selection{background:rgba(212,255,58,.35)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:rgba(16,14,12,.85);backdrop-filter:blur(14px);border-right:1px solid var(--filet);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.marque{display:flex;align-items:center;gap:11px;padding:0 6px}
.marque img{width:42px;height:42px;border-radius:12px;box-shadow:0 0 0 1px var(--filet2),0 8px 24px rgba(212,255,58,.18)}
.marque b{font-family:var(--titre);font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.marque b i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.marque span{display:block;font-size:10.5px;color:var(--pale);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:10px 12px;border-radius:11px;color:var(--doux);text-decoration:none;font-weight:600;font-size:14px;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface2);color:var(--texte)}
.nav a[aria-current="page"]{background:var(--surface3);color:var(--texte);box-shadow:inset 0 0 0 1px var(--filet2)}
.nav a[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--or);box-shadow:0 0 10px var(--or);margin-right:-2px}
.nav .nb{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--grad);color:#0B0F02;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.side .pied{margin-top:auto;font-size:11.5px;color:var(--pale);padding:10px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--filet);border-radius:12px;background:var(--surface)}
.side .pied span::before{content:"● ";color:var(--vert)}.side .pied span:empty{display:none}
.main{padding:26px 34px 80px;min-width:0;max-width:1440px}
.tete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.tete p{color:var(--doux);max-width:72ch;margin-top:6px}
.k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--or);font-weight:800}
.carte{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)) ,var(--surface);border:1px solid var(--filet);border-radius:18px;padding:18px;min-width:0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pile{display:flex;flex-direction:column;gap:12px}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--doux)}
.vide{border:1.5px dashed var(--filet2);border-radius:18px;padding:28px;text-align:center;color:var(--doux);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--grad);color:#0B0F02;font-weight:800;font-size:13.5px;cursor:pointer;text-decoration:none;box-shadow:0 6px 22px rgba(212,255,58,.22);transition:transform .12s,box-shadow .12s}

<script>
/* Plateforme Test and Learn : base, images, connexion et appels aux fonctions, sur Supabase */
(function(){
"use strict";
const URL_SB="https://yapuwtsrwagowtuzwdlu.supabase.co",CLE="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhcHV3dHNyd2Fnb3d0dXp3ZGx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjAzNDIsImV4cCI6MjEwNjc5NjM0Mn0.x3v2HhMk4acPKE0M9ZqFOQU8bYBm4-A-pL7ROX22eQA";
const MEDIA=URL_SB+"/storage/v1/object/public/media/";
window.TL_MEDIA=MEDIA;
const sb=window.supabase.createClient(URL_SB,CLE,{auth:{persistSession:true,autoRefreshToken:true}});
window.TL_SB=sb;
let pretResolve;const pret=new Promise(r=>pretResolve=r);
function erreur(code,message){const e=new Error(message||code);e.code=code;return e}
function instantane(lignes){return {docs:lignes.map(l=>({id:l.id,exists:true,data:()=>l.data})),size:lignes.length}}
const abonnes={};
function abonnerCol(col,cb){
 let lignes=new Map();const pousser=()=>cb(instantane([...lignes.values()]));
 sb.from("docs").select("id,data").eq("col",col).limit(2000).then(({data,error})=>{if(error){console.error(error);return}(data||[]).forEach(l=>lignes.set(l.id,l));pousser()});
 const canal=sb.channel("col-"+col+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+col},p=>{
  if(p.eventType==="DELETE"){lignes.delete(p.old.id)}else{lignes.set(p.new.id,{id:p.new.id,data:p.new.data})}pousser()}).subscribe();
 return ()=>sb.removeChannel(canal)}
function decouper(chemin){const i=chemin.lastIndexOf("/");return [chemin.slice(0,i),chemin.slice(i+1)]}
async function lire(col,id){const {data,error}=await sb.from("docs").select("data,version").eq("col",col).eq("id",id).maybeSingle();if(error)throw erreur("upstream_error",error.message);return data}
const db={
 collection(col){const q={limit:()=>q,orderBy:()=>q,where:()=>q,onSnapshot:(cb)=>abonnerCol(col,cb),doc:(id)=>db.doc(col+"/"+id)};return q},
 doc(chemin){const [col,id]=decouper(chemin);return {
  async get(){const d=await lire(col,id);return {exists:!!d,data:()=>d&&d.data}},
  onSnapshot(cb){let actuel=null;const envoyer=()=>cb({exists:!!actuel,data:()=>actuel});
   lire(col,id).then(d=>{actuel=d&&d.data;envoyer()}).catch(()=>{});
   const canal=sb.channel("doc-"+col+"-"+id+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+col},p=>{const r=p.new&&p.new.id?p.new:p.old;if(!r||r.id!==id)return;actuel=p.eventType==="DELETE"?null:p.new.data;envoyer()}).subscribe();
   return ()=>sb.removeChannel(canal)},
  async set(data){const {error}=await sb.from("docs").upsert({col,id,data},{onConflict:"col,id"});if(error)throw erreur(/row-level|permission/i.test(error.message)?"invalid_argument":"upstream_error",error.message)},
  async update(champs){for(let i=0;i<5;i++){const d=await lire(col,id);if(!d){await this.set(champs);return}
    const neuf=Object.assign({},d.data,champs);const {data,error}=await sb.from("docs").update({data:neuf}).eq("col",col).eq("id",id).eq("version",d.version).select("version");
    if(error)throw erreur("upstream_error",error.message);if(data&&data.length)return}throw erreur("conflict","conflit")},
  async delete(){await sb.from("docs").delete().eq("col",col).eq("id",id)}}}};
const assets={async upload(fichier,opts){const type=(opts&&opts.type)||fichier.type||"application/octet-stream";const ext=(fichier.name&&fichier.name.includes(".")?fichier.name.split(".").pop():type.split("/").pop()).toLowerCase().replace(/[^a-z0-9]/g,"");
 if(fichier.size>20*1024*1024)throw erreur("too_large");
 const chemin="depots/"+new Date().toISOString().slice(0,10)+"/"+crypto.randomUUID()+"."+ext;
 const {error}=await sb.storage.from("media").upload(chemin,fichier,{contentType:type,upsert:false});if(error)throw erreur("upstream_error",error.message);
 return {id:chemin,url:MEDIA+chemin,sizeBytes:fichier.size,contentType:type}}};
async function fonction(nom,corps){const {data,error}=await sb.functions.invoke(nom,{body:corps});if(error){let m=error.message;try{const j=await error.context.json();m=j.erreur||m}catch(e){}throw erreur("upstream_error",m)}return data}
window.TL_FONCTION=fonction;
function sample(){}
sample.limits=async()=>({images:true});
sample.json=async(texte,opts)=>{const r=await fonction("claude",{prompt:texte,images:(opts&&opts.chemins)||[]});const t=r.texte||"";const m=t.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m?m[0]:t)};
let session=null;
const user={id:async()=>session&&session.user.id,email:()=>session&&session.user.email};
window.claude={use:async(nom)=>{await pret;return {db,assets,user,sample}[nom]||null}};
window.TL_DECONNEXION=async()=>{await sb.auth.signOut();location.reload()};
function ecranConnexion(msg){document.body.classList.add("hors-ligne");const m=document.getElementById("main");
 m.innerHTML='<div class="connexion"><img src="'+(document.querySelector(".marque img")||{}).src+'" alt=""><h1>test<span class="dore">&amp;</span>learn</h1><p class="note">L\'atelier créa de La Maison de Louise</p>'

async function envoyerImages(files){if(!S.assets){toast("Dépôt indisponible : accès Éditeur requis.");return}let n=0;for(const f of files){try{const r=await S.assets.upload(f);await ecrire("refs/r"+r.id,{asset:r.id,note:"",tags:[],ts:maintenant(),par:S.uid});if(S.tab==="creer"){S.form.refs=S.form.refs.concat("a:"+r.id);saveForm();S.srcTab="captures"}n++}catch(e){toast(e&&e.code==="too_large"?"Image trop lourde (20 Mo max).":"Dépôt refusé : "+(e&&e.code||"erreur"))}}if(n)toast(n+" référence(s) ajoutée(s)")}
async function envoyerDepots(files){if(!S.assets)return;let n=0;for(const f of files){const ext=(f.name.split(".").pop()||"").toLowerCase();const type={csv:"text/csv",txt:"text/plain",json:"application/json",md:"text/markdown",pdf:"application/pdf"}[ext];try{const r=await S.assets.upload(f,type?{type}:undefined);await ecrire("depots/d"+r.id,{asset:r.id,nom:f.name,ts:maintenant(),traite:false,par:S.uid});n++}catch(e){toast("Dépôt refusé : "+(e&&e.code||"erreur"))}}if(n)toast(n+" fichier(s) déposé(s)")}

async function genererMere(){const f=S.form;autoEtiq(f);if(etiqManquantes(f.labels,f.tunnel).length){toast("Claude complète les étiquettes…");await proposerFiche(true)}
 const n=prochainNum();const code=codeId(n);const nom=nomComplet(code+"H1",f.labels,f.tunnel);if(!nom){S.etiqOuvert=true;rendre();toast("Claude n'a pas pu compléter : choisis les étiquettes manquantes dans « Modifier les étiquettes »");return}
 const id="m"+String(n).padStart(3,"0")+"-"+Date.now().toString(36);
 const ok=await ecrire("meres/"+id,{num:n,code,batch:f.batch,refs:f.refs.map(r=>r.slice(2)),idee:f.idee,headline:f.headline,sous:f.sous,offre:f.offre,bouton:f.bouton,badges:f.badges,produit:f.produit!==false,sac:f.sac||"pain",textes:f.textes||"miens",note:f.note,tunnel:f.tunnel,labels:Object.assign({},f.labels,{tunnel:f.tunnel}),formats:f.formats,titre:f.titre,pos:f.pos||{},statut:"a_generer",nom,ts:maintenant(),par:S.uid,images:{}});
 if(ok){lancer("meres",id);toast(code+" envoyée au moteur : elle arrive dans « À valider » d'ici 1 à 3 minutes");S.form=Object.assign(formVide(),{batch:f.batch,labels:{format:f.labels.format},formats:f.formats.slice(0,1)});saveForm()}}
async function validerMere(id){const m=S.meres.find(x=>x.id===id);if(!m)return;if(!await ecrire("meres/"+id,{statut:"validee",valideTs:maintenant()},true))return;
 await ecrire("creas/"+m.code+"H1",{mere:m.code,mereId:m.id,code:m.code+"H1",type:"H",batch:m.batch,nom:nomComplet(m.code+"H1",m.labels,m.tunnel),labels:m.labels,tunnel:m.tunnel,headline:m.headline,sous:m.sous,offre:m.offre,bouton:m.bouton,badges:m.badges,produit:m.produit,titre:m.titre,images:m.images,formats:m.formats,changes:["référence verrouillée"],statut:"validee",ts:maintenant(),par:S.uid});
 S.decl={mere:id,versions:[]};toast(m.code+"H1 validée : prête à décliner");}
async function genererDeclinaisons(){const m=S.meres.find(x=>x.id===S.decl.mere);if(!m)return;let n=0;
 for(const v of S.decl.versions){const labels=Object.assign({},m.labels,{tunnel:v.tunnel});if(v.tunnel!==m.tunnel&&v.tunnel==="BOFU"&&labels.offre==="NONE")labels.offre="PACK";
  const nom=nomComplet(v.code,labels,v.tunnel);const ok=await ecrire("creas/"+v.code,{mere:m.code,mereId:m.id,code:v.code,type:v.type,batch:m.batch,nom,labels,tunnel:v.tunnel,headline:v.headline,sous:v.sous,offre:v.offre,bouton:v.bouton,badges:v.badges,produit:v.produit,sac:m.sac||"pain",titre:v.titre,note:v.note,pos:v.pos||{},changes:changements(m,v),formats:m.formats,base:m.images,statut:"a_generer",images:{},ts:maintenant(),par:S.uid});if(ok){n++;lancer("creas",v.code)}}
 S.decl.versions=[];toast(n+" déclinaison(s) envoyée(s) au moteur");rendre()}
async function itererGagnante(adId){const x=S.metrics.find(m=>m.id===adId)||(S.recentes||[]).find(m=>m.id===adId);if(!x||!x.thumb){toast("Visuel indisponible pour cette créa.");return}const e=etiqMeta(x)||{};
 const f=Object.assign(formVide(),{batch:S.form.batch||"",refs:["a:"+x.thumb],textes:"modele",headline:"",sous:"",offre:"",bouton:"",badges:[],produit:true,sac:S.form.sac||"pain",formats:[S.form.formats&&S.form.formats[0]||"4:5"],note:"Itération de la gagnante "+x.nom+". "});
 f.labels={format:e.format||"STPH",approche:e.approche||"",conscience:e.conscience||"",desir:e.desir||"",emotion:e.emotion||"",offre:e.offre||""};f.auto={};if(e.tunnel){f.tunnel=e.tunnel;f.auto.tunnel=true}if(e.offre)f.auto.offre=true;
 S.form=f;saveForm();$("#modal").innerHTML="";S.srcTab="gagnantes";allerA("creer");toast("Gagnante chargée comme modèle : ses textes sont gardés. Change seulement ce que tu veux, puis génère.")}

/* ============ PROPOSITIONS CLAUDE (compte de l'utilisateur) ============ */
async function imagesRefs(ids){const out=[];for(const id of ids.slice(0,3)){try{const r=await fetch(blob(id));if(r.ok){const b=await r.blob();if(/image\/(png|jpeg|webp|gif)/.test(b.type))out.push(b)}}catch(e){}}return out}
async function proposerFiche(silencieux){if(!S.sample)return;const st=$("#propStatut");if(!S.form.refs.length){toast("Choisis d'abord une référence.");return}st.textContent="Claude réfléchit…";
 try{const lim=await S.sample.limits().catch(()=>null);const chemins=S.form.refs.map(r=>r.slice(2)).slice(0,3);
  const p="Tu es stratège créatif pour La Maison de Louise, marque française de sacs à pain en coton naturel et cire d'abeille (jamais lin, jamais propolis). Offres : lot de 2 sacs 39,90 €, pack de 4 sacs 59,90 €. Note : 4,8/5 et 3 127 avis. Interdits : le mot « croustillant », « 7 jours » avec une baguette, tiret cadratin, pointer le client (« le vôtre »). Ton : simple, chaleureux, une idée comprise en une seconde.\nLes images jointes sont des pubs de référence repérées par le stratège (concurrents ou autres niches). Adapte leur idée et leur mise en page à La Maison de Louise.\n"+(S.form.idee?"Idée du stratège : "+S.form.idee+"\n":"")+"Réponds uniquement en JSON : {\"headline\":\"…\",\"sous\":\"…\",\"idee\":\"description du visuel à générer\",\"produit_visible_dans_reference\":true|false,\"tunnel\":\"TOFU|MOFU|BOFU\",\"approche\":\""+ETIQ.approche.v.join("|")+"\",\"conscience\":\""+ETIQ.conscience.v.join("|")+"\",\"desir\":\""+ETIQ.desir.v.join("|")+"\",\"emotion\":\""+ETIQ.emotion.v.join("|")+"\",\"offre\":\"NONE|PACK|GAR|AVIS|PROMO\",\"format\":\"STPH|STGR\"}";
  const j=await S.sample.json(p,{chemins});
  const f=S.form;if(!f.headline&&j.headline)f.headline=j.headline;if(!f.sous&&j.sous)f.sous=j.sous;if(!f.idee&&j.idee)f.idee=j.idee;if(typeof j.produit_visible_dans_reference==="boolean")f.produit=j.produit_visible_dans_reference;
  if(!f.tunnel&&ETIQ.tunnel.v.includes(j.tunnel))f.tunnel=j.tunnel;["approche","conscience","desir","emotion","offre","format"].forEach(k=>{if(!f.labels[k]&&ETIQ[k].v.includes(j[k]))f.labels[k]=j[k]});
  saveForm();rendre();const s2=$("#propStatut");if(s2)s2.textContent="Proposition faite"+(typeof j.produit_visible_dans_reference==="boolean"?(" · produit visible dans la référence : "+(j.produit_visible_dans_reference?"oui":"non")):"")+". Corrige ce que tu veux."}
 catch(e){st.textContent=e&&e.code==="not_granted"?"Propositions désactivées.":"Proposition impossible pour l'instant."}}
async function proposerHooks(){const m=S.meres.find(x=>x.id===S.decl.mere);if(!m||!S.sample)return;const box=$("#hooksProp");box.innerHTML='<p class="note">Claude réfléchit…</p>';
 const phrases=(S.resume&&S.resume.verbatims&&S.resume.verbatims.phrases)||[];
 try{const j=await S.sample.json("Propose 10 accroches (headlines) pour une pub statique de La Maison de Louise (sac à pain en coton naturel et cire d'abeille, lot de 2 à 39,90 €). Étage du tunnel : "+m.tunnel+". Headline actuelle : « "+m.headline+" ». Une idée par accroche, comprise en une seconde, sans le mot « croustillant », sans tiret cadratin, sans pointer le client."+(phrases.length?" Inspire-toi de ces mots exacts de clients : "+phrases.slice(0,15).join(" | "):"")+" Réponds uniquement en JSON : [\"…\",\"…\"]");
  box.innerHTML='<div class="carte pile" style="margin-bottom:10px"><p class="k">Clique pour ajouter une version H</p><div class="puces">'+(Array.isArray(j)?j:[]).slice(0,10).map(h=>'<button class="puce" data-a="choisirHook" data-v="'+esc(h)+'">'+esc(h)+'</button>').join("")+'</div></div>'}
 catch(e){box.innerHTML='<p class="note">'+(e&&e.code==="not_granted"?"Propositions désactivées.":"Proposition impossible pour l'instant.")+'</p>'}}

/* ============ DÉMARRAGE ============ */
function abonner(col,cle){try{S.db.collection(col).limit(1000).onSnapshot(sn=>{S[cle]=sn.docs.map(d=>Object.assign({id:d.id},d.data()));rendre()},()=>{})}catch(e){}}
async function demarrer(){const h=location.hash.slice(1);if(ONGLETS.some(o=>o[0]===h))S.tab=h;
 const [db,assets,user,sample]=await Promise.all(["db","assets","user","sample"].map(n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null)));
 S.db=db;S.assets=assets;S.user=user;S.sample=sample;S.pret=true;
 if(user){try{S.uid=await user.id()}catch(e){}}
 if(!db){$("#main").innerHTML='<div class="vide"><h2>Atelier indisponible ici</h2><p>Ouvre l\'application depuis claude.ai, connecté avec un compte qui y a accès.</p></div>';return}
 ["meres","creas","batches","refs","depots"].forEach(c=>abonner(c,c));
 try{S.db.collection("metrics").limit(100).onSnapshot(sn=>{const out=[];sn.docs.forEach(d=>{const x=d.data();(x.ads||[]).forEach(a=>out.push(Object.assign({},a)))});let fin="";out.forEach(m=>(m.d||[]).forEach(r=>{if(r[0]>fin)fin=r[0]}));
  viderCache();S.recentes=out.filter(m=>m.lance&&m.lance>=fin);S.metrics=out.filter(m=>!(m.lance&&m.lance>=fin));rendre()},()=>{})}catch(e){}
 try{S.db.doc("etat/resume").onSnapshot(d=>{S.resume=d.exists?d.data():null;const mt=$("#moteur");if(mt&&S.resume&&S.resume.maj)mt.textContent="Données Meta : "+new Date(S.resume.maj).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});rendre()},()=>{})}catch(e){}
 try{const q=$("#qui");if(q&&S.user&&S.user.email)q.textContent="Connecté : "+S.user.email()}catch(e){}
 rendre()}
demarrer();
})();
</script>
